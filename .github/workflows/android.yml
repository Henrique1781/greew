name: Gerar APK (Android)

# Roda a cada push e tambem no botao "Run workflow" da aba Actions
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: SDK do Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Gerar icones
        run: node tools/gen-icons.js

      - name: Criar projeto Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Icone e splash nativos
        run: npx @capacitor/assets generate --android || echo "assets opcionais falharam, seguindo"

      - name: Sincronizar web -> Android
        run: npx cap sync android

      - name: Compilar o APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: GREEN-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
