<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GREEN — Análise Esportiva</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header" id="appHeader">
  <button class="hbtn" id="btnBack" aria-label="Voltar" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Back</span>
  </button>
  <div class="brand" id="brand">
    <svg class="crest" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 5l4 3 8-5 8 5 4-3v13c0 6-5.5 10.5-12 14C9.5 28.5 4 24 4 18z" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M11 15.5l3.5 3.5L22 11" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <button class="hbtn right" id="btnHeaderAction" aria-label="Ações">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar"></nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-grab"></div><div class="sheet-body" id="sheetBody"></div></div>

<div class="toast-wrap" id="toasts"></div>

<script src="js/store.js"></script>
<script src="js/native.js"></script>
<script src="js/motor.js"></script>
<script src="js/stats.js"></script>
<script src="js/fixtures.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
